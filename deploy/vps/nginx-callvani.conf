map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  listen [::]:80;
  server_name callvani.com www.callvani.com;

  # Serve landing media directly so Safari/mobile browsers can request byte
  # ranges while scroll-scrubbing. The application asset binding returns the
  # entire MP4 for a Range request, which makes the intro appear frozen on
  # slower devices even though the client-side timeline is correct.
  location ^~ /media/ {
    root /opt/callvani/public;
    try_files $uri =404;
    add_header Accept-Ranges "bytes" always;
    add_header Cache-Control "public, max-age=3600, s-maxage=86400, stale-while-revalidate=86400" always;
  }

  location /media-stream/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
